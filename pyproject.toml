[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "model-auditor"
dynamic = ["version"]
description = "A library for evaluating ML model performance across subgroups with stratified metrics and bootstrap confidence intervals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Beatrice Brown-Mulry"}
]
keywords = [
    "machine-learning",
    "model-evaluation",
    "metrics",
    "fairness",
    "audit",
    "classification",
    "confidence-intervals",
    "bootstrap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "pandas >= 2.2",
    "numpy >= 2.1",
    "scikit-learn >= 1.5",
    "scipy >= 1.14",
    "tqdm >= 4.0",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7", "plotly>=5"]
styling = ["jinja2>=3.1"]
dev = ["model-auditor[plotting,styling]", "pytest>=8", "ruff>=0.9,<0.17", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/beatrice-b-m/model-auditor"
Documentation = "https://model-auditor-docs.beatricebm.workers.dev"
Repository = "https://github.com/beatrice-b-m/model-auditor"
Issues = "https://github.com/beatrice-b-m/model-auditor/issues"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["model_auditor*"]

[tool.setuptools.package-data]
model_auditor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
include = ["model_auditor/**/*.py", "tests/**/*.py", "validation/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
